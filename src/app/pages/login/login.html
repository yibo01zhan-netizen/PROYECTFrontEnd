<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 bg-white shadow-lg rounded-4 overflow-hidden" style="max-width: 900px;">
    
    <!-- Columna Izquierda (Logo) -->
    <div class="col-md-6 d-none d-md-flex flex-column align-items-center justify-content-center bg-primary bg-opacity-10 p-5">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-cart3 text-primary" style="font-size: 3rem;"></i>
        <span class="text-dark" style="font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 2.5rem; letter-spacing: -1px;">
          Compra<span class="text-primary">Ya</span>
        </span>
      </div>
      <p class="fs-5 text-muted text-center">Tu tienda, en un solo lugar.</p>
    </div>

    <!-- Columna Derecha (Formulario de Login) -->
    <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
      <h3 class="mb-4 fw-bold">Iniciar sesión</h3>
      <p class="text-muted mb-4">Ingresa a tu cuenta para continuar</p>
      
      <!-- Usamos un div en lugar de form para evitar envíos nativos en la URL -->
      <div class="w-100">
        <!-- Correo electrónico -->
        <div class="mb-3">
          <label class="form-label text-dark fw-medium">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control form-control-lg bg-light border-start-0" placeholder="tu@email.com" name="email" [(ngModel)]="loginModel.email">
          </div>
        </div>
        
        <!-- Contraseña -->
        <div class="mb-4">
          <label class="form-label text-dark fw-medium">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control form-control-lg bg-light border-start-0" placeholder="Ingresa tu contraseña" name="password" [(ngModel)]="loginModel.password">
            <span class="input-group-text bg-light"><i class="bi bi-eye"></i></span>
          </div>
        </div>
        
        <!-- Botón con (click) -->
        <button type="button" (click)="LoginAction()" class="btn btn-primary btn-lg w-100 mb-4 rounded-pill fw-bold">Iniciar sesión</button>
      </div>
      
      <!-- Navegación al registro -->
      <div class="text-center">
        <span class="text-muted">¿No tienes una cuenta? </span>
        <a class="text-primary text-decoration-none fw-bold">Regístrate</a>
      </div>
    </div>

  </div>
</div>
